<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="index.html">Ir al Inicio</a> <br>
    <h1>suma</h1>
    <script>
        let n1=Number(prompt('introduce el primer numero'));
        let n2=Number(prompt('introduce el segundo numero'));
        suma=n1+n2;
        document.write("el valor de la suma es "+suma);
        document.write("<br>")
        resta=n1-n2;
        document.write("el valor de la resta es "+resta);
        document.write("<br>")
        mult=n1*n2;
        document.write("el valor de la multiplicacion es "+mult);
        document.write("<br>")
        division=n1/n2;
        document.write("el valor de la division es "+division);

    </script>
</body>
</html>
